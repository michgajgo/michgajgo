<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>익명 후원 송금</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard 폰트 (토스/카카오에서 주로 사용하는 트렌디한 폰트) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #f2f4f6; }
        
        /* 숨김 스크롤바 */
        ::-webkit-scrollbar { display: none; }
        
        /* 바텀 시트 애니메이션 */
        .bottom-sheet { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .bottom-sheet.open { transform: translateY(0); }
        
        /* 배경 오버레이 애니메이션 */
        .overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .overlay.open { opacity: 1; pointer-events: auto; }

        /* 금액 입력란 특화 스타일 (깜빡이는 커서 색상 등) */
        .amount-input::placeholder { color: #d1d6db; }
        .amount-input:focus { outline: none; }

        /* 로딩 스피너 */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3182f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen sm:p-4">

    <!-- 모바일 앱 화면 크기의 메인 컨테이너 -->
    <div class="w-full h-screen sm:h-auto sm:max-w-md sm:rounded-[2rem] bg-white sm:shadow-2xl relative overflow-hidden flex flex-col">
        
        <!-- 상단 헤더 -->
        <header class="flex items-center justify-between p-5 pt-8 pb-4">
            <button class="p-2 -ml-2 text-gray-400 hover:text-gray-800 transition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h1 class="text-lg font-bold text-gray-800">익명 후원</h1>
            <div class="w-8"></div> <!-- 밸런스를 위한 빈 공간 -->
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 overflow-y-auto px-6 pb-24">
            
            <!-- 받는 사람 정보 -->
            <div class="flex items-center space-x-3 mb-8 mt-2">
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-xl shadow-sm">
                    🎁
                </div>
                <div>
                    <p class="text-sm font-medium text-gray-500">받는 분</p>
                    <p class="text-lg font-bold text-gray-900">익명의 창작자</p>
                </div>
            </div>

            <!-- 금액 입력 섹션 -->
            <div class="mb-10 text-center mt-6">
                <div class="flex justify-center items-baseline">
                    <input type="text" id="amountInput" class="amount-input text-4xl sm:text-5xl font-bold text-center w-full max-w-[250px] bg-transparent text-gray-900" placeholder="얼마를" inputmode="numeric" oninput="formatNumber(this)">
                    <span id="wonLabel" class="text-2xl font-bold text-gray-900 ml-1 hidden">원</span>
                </div>
                <p class="text-gray-400 text-sm mt-3" id="amountHelp">보낼까요?</p>
            </div>

            <!-- 결제 수단 선택 -->
            <div class="space-y-4">
                <h3 class="text-sm font-bold text-gray-800 mb-3 ml-1">결제 수단</h3>
                
                <!-- 간편결제 그룹 -->
                <div class="grid grid-cols-2 gap-3">
                    <!-- 토스페이 -->
                    <label class="relative cursor-pointer">
                        <input type="radio" name="payMethod" value="toss" class="peer sr-only">
                        <div class="p-4 border-2 border-gray-100 rounded-2xl peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:bg-gray-50 transition flex flex-col items-center justify-center space-y-2">
                            <div class="w-10 h-10 bg-[#0064FF] text-white rounded-full flex items-center justify-center font-bold text-xs italic">toss</div>
                            <span class="text-sm font-semibold text-gray-700">토스페이</span>
                        </div>
                    </label>

                    <!-- 카카오페이 -->
                    <label class="relative cursor-pointer">
                        <input type="radio" name="payMethod" value="kakao" class="peer sr-only">
                        <div class="p-4 border-2 border-gray-100 rounded-2xl peer-checked:border-yellow-400 peer-checked:bg-yellow-50 hover:bg-gray-50 transition flex flex-col items-center justify-center space-y-2">
                            <div class="w-10 h-10 bg-[#FEE500] text-[#000000] rounded-full flex items-center justify-center font-black text-xs">pay</div>
                            <span class="text-sm font-semibold text-gray-700">카카오페이</span>
                        </div>
                    </label>
                </div>

                <!-- 직접 계좌이체 (무통장 입금) -->
                <label class="relative cursor-pointer block mt-3">
                    <input type="radio" name="payMethod" value="transfer" class="peer sr-only" checked>
                    <div class="p-4 border-2 border-gray-100 rounded-2xl peer-checked:border-gray-800 peer-checked:bg-gray-50 hover:bg-gray-50 transition flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-lg">🏦</div>
                            <div>
                                <span class="block text-sm font-semibold text-gray-800">직접 계좌이체 (추천)</span>
                                <span class="block text-xs text-gray-500">수수료 없이 100% 전달됩니다.</span>
                            </div>
                        </div>
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                </label>
            </div>
        </main>

        <!-- 하단 고정 버튼 -->
        <div class="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-white via-white to-transparent pt-10">
            <button onclick="handlePayClick()" id="mainBtn" class="w-full bg-[#3182f6] hover:bg-[#1b64da] text-white font-bold text-lg py-4 rounded-2xl shadow-lg transition-transform active:scale-95 flex justify-center items-center">
                <span>보내기</span>
            </button>
        </div>

        <!-- ==========================================
             바텀 시트 모달 영역 (계좌번호 안내 및 결제 진행)
             ========================================== -->
        <!-- 어두운 배경 오버레이 -->
        <div id="overlay" class="overlay absolute inset-0 bg-black bg-opacity-40 z-40" onclick="closeSheet()"></div>
        
        <!-- 바텀 시트 컨텐츠 -->
        <div id="bottomSheet" class="bottom-sheet absolute bottom-0 left-0 right-0 bg-white rounded-t-[2rem] z-50 p-6 pt-2 pb-10 shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
            <!-- 드래그 핸들 (장식용) -->
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto my-3"></div>
            
            <div id="sheetContent" class="mt-4">
                <!-- 자바스크립트에서 상황에 맞게 내용이 채워집니다. -->
            </div>
        </div>

    </div>

    <!-- 스크립트 로직 -->
    <script>
        let rawAmount = 0;

        // 금액 입력 시 콤마 추가 및 UI 변경 로직
        function formatNumber(input) {
            // 숫자만 추출
            const value = input.value.replace(/[^0-9]/g, '');
            rawAmount = parseInt(value || 0);

            const wonLabel = document.getElementById('wonLabel');
            const helpText = document.getElementById('amountHelp');

            if (value === '') {
                input.value = '';
                wonLabel.classList.add('hidden');
                helpText.innerText = '보낼까요?';
                helpText.classList.remove('text-blue-500', 'font-bold');
            } else {
                // 3자리 콤마 포맷팅
                input.value = Number(value).toLocaleString();
                wonLabel.classList.remove('hidden');
                helpText.innerText = '입력 완료';
                helpText.classList.add('text-blue-500', 'font-bold');
            }
        }

        // 보내기 버튼 클릭 처리
        function handlePayClick() {
            if (rawAmount < 1000) {
                alertCustom("최소 1,000원 이상 입력해주세요.");
                return;
            }

            const method = document.querySelector('input[name="payMethod"]:checked').value;
            const formatted = rawAmount.toLocaleString() + '원';

            if (method === 'transfer') {
                showTransferSheet(formatted);
            } else {
                showPGSheet(method, formatted);
            }
        }

        // [시나리오 1] 직접 계좌이체 (실제 사용 가능)
        function showTransferSheet(amountStr) {
            const content = `
                <div class="text-center">
                    <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">🏦</div>
                    <h2 class="text-xl font-bold text-gray-900 mb-1">아래 계좌로 송금해주세요</h2>
                    <p class="text-gray-500 text-sm mb-6">입금이 확인되면 후원이 완료됩니다.</p>
                    
                    <div class="bg-gray-50 rounded-2xl p-5 mb-6 text-left border border-gray-100">
                        <p class="text-xs text-gray-500 font-semibold mb-1">입금 계좌</p>
                        <div class="flex justify-between items-center mb-4">
                            <p class="text-lg font-bold text-gray-900 tracking-tight" id="accountNumber">국민 8062-9073-0338-54</p>
                            <button onclick="copyAccount()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs font-bold py-1.5 px-3 rounded-lg transition">복사</button>
                        </div>
                        
                        <p class="text-xs text-gray-500 font-semibold mb-1">송금 금액</p>
                        <p class="text-xl font-bold text-[#3182f6]">${amountStr}</p>
                    </div>

                    <button onclick="closeSheet()" class="w-full bg-gray-900 text-white font-bold py-4 rounded-xl active:scale-95 transition">확인했습니다</button>
                </div>
            `;
            openSheet(content);
        }

        // [시나리오 2] 간편결제 (PG연동 시뮬레이션)
        function showPGSheet(method, amountStr) {
            const isToss = method === 'toss';
            const pgName = isToss ? '토스페이' : '카카오페이';
            const color = isToss ? 'text-[#3182f6]' : 'text-[#FEE500]';
            const bgColor = isToss ? 'bg-[#3182f6]' : 'bg-[#FEE500]';
            const textColor = isToss ? 'text-white' : 'text-black';

            // 로딩 화면 표시
            const loadingContent = `
                <div class="text-center py-8">
                    <div class="loader mx-auto mb-4 border-t-[#3182f6]"></div>
                    <h2 class="text-lg font-bold text-gray-900 mb-2">${pgName} 앱을 열고 있습니다...</h2>
                    <p class="text-sm text-gray-500">결제 금액: ${amountStr}</p>
                </div>
            `;
            openSheet(loadingContent);

            // 1.5초 후 결과 화면으로 전환 (PG사 API 연동이 들어갈 자리)
            setTimeout(() => {
                const resultContent = `
                    <div class="text-center py-4">
                        <div class="w-16 h-16 ${bgColor} rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 ${textColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 mb-2">결제 대기중</h2>
                        <p class="text-gray-600 text-sm mb-6 leading-relaxed bg-gray-50 p-4 rounded-xl text-left">
                            현재는 테스트 환경입니다.<br>
                            실제 서비스에서는 이 시점에 <strong>${pgName} 앱</strong>이 실행되어 결제가 진행되며, 완료 후 정산 계좌(국민은행 8062-9073-0338-54)로 자동 정산됩니다.
                        </p>
                        <button onclick="closeSheet()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-4 rounded-xl active:scale-95 transition">닫기</button>
                    </div>
                `;
                document.getElementById('sheetContent').innerHTML = resultContent;
            }, 1500);
        }

        // 바텀 시트 열기
        function openSheet(htmlContent) {
            document.getElementById('sheetContent').innerHTML = htmlContent;
            document.getElementById('overlay').classList.add('open');
            document.getElementById('bottomSheet').classList.add('open');
        }

        // 바텀 시트 닫기
        function closeSheet() {
            document.getElementById('overlay').classList.remove('open');
            document.getElementById('bottomSheet').classList.remove('open');
        }

        // 계좌번호 복사 기능
        function copyAccount() {
            const acc = "80629073033854";
            
            // iFrame 환경 등에서의 복사를 위한 폴백 로직 포함
            try {
                // 구형 브라우저 방식 (가장 안정적임)
                const tempInput = document.createElement("input");
                tempInput.value = acc;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                alertCustom("국민은행 계좌번호가 복사되었습니다!\n은행 앱에서 붙여넣기 해주세요.");
            } catch (err) {
                alertCustom("복사 실패. 계좌번호를 직접 메모해주세요: " + acc);
            }
        }

        // 커스텀 알림창 (alert 대체)
        function alertCustom(msg) {
            const content = `
                <div class="text-center py-4">
                    <p class="text-gray-800 font-medium mb-6 whitespace-pre-line">${msg}</p>
                    <button onclick="closeSheet()" class="w-full bg-[#3182f6] text-white font-bold py-3.5 rounded-xl active:scale-95 transition">확인</button>
                </div>
            `;
            openSheet(content);
        }
    </script>
</body>
</html>
